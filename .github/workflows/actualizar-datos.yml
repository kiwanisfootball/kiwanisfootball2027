name: Sincronizar Datos KFL

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada 1 hora
  workflow_dispatch: 

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Crear carpeta de datos si no existe
        run: mkdir -p data

      - name: Descargar JSON desde Google Apps Script
        run: |
          curl -s "TU_URL_DE_GAS_CONTACT?modulo=all_data" -o data/contact-db.json
          curl -s "TU_URL_DE_GAS_FLAG?modulo=all_data" -o data/flag-db.json

      - name: Subir cambios al repositorio si hubo modificaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualización de datos KFL" && git push)
