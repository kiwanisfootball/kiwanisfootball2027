name: Sincronizar Datos KFL

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-sot]

permissions:
  contents: write

concurrency:
  group: sincronizar-datos-kfl
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar datos públicos del SOT
        run: node scripts/sync-sot.js

      - name: Publicar JSON solo cuando cambien
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'data/*.json'
          if git diff --cached --quiet; then
            echo "Los datos ya están actualizados."
            exit 0
          fi
          git commit -m "Auto: Actualización de datos KFL"
          git push
