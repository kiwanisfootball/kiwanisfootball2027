name: Generar Indice del Blog

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar Script de Indice
        run: node generate-index.js

      - name: Commit y Push automático del JSON
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-actualizar index.json del blog [skip ci]"
          file_pattern: "blog/index.json"
