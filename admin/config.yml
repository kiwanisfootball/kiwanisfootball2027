backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads/blog"
public_folder: "/assets/uploads/blog"

collections:
  - name: "blog"
    label: "Noticias KFL"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Imagen de Portada", name: "coverImage", widget: "image", required: true }
      - { label: "Autor", name: "author", widget: "hidden", default: "kiwanisfootball" }
      - { label: "Resumen / Extracto", name: "excerpt", widget: "text", required: false }
      - { label: "Categoría / Tag", name: "category", widget: "select", options: ["Liga", "Equipos", "Comunicados", "Eventos"], default: "Liga" }
      - { label: "Cuerpo del Artículo", name: "body", widget: "markdown" }
