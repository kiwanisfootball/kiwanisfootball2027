backend:
  name: github
  repo: kiwanisfootball/kiwanisfootball2027
  branch: main
  base_url: https://kfl-decap-oauth.vercel.app
  auth_endpoint: api/auth
  site_domain: kiwanisfootball2027.vercel.app

# Identidad visual de KFL en el panel de administración
display_url:
  logo: https://i.imgur.com/wrPDjDN.png

media_folder: "assets/uploads/blog"
public_folder: "/assets/uploads/blog"

collections:
  - name: "blog"
    label: "Noticias KFL"
    folder: "blog"
    create: true
    # Genera slugs limpios terminados en fecha (ej: mi-noticia-2026-10-26)
    slug: "{{slug}}-{{year}}-{{month}}-{{day}}"
    path: "{{slug}}-{{year}}-{{month}}-{{day}}/index"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "DD/MM/YYYY", time_format: "hh:mm A" }
      - { label: "Imagen de Portada", name: "coverImage", widget: "image" }
      - { label: "Autor", name: "author", widget: "hidden", default: "kiwanisfootball" }
      - { label: "Resumen", name: "excerpt", widget: "text", required: false }
      - label: "Categoría Principal"
        name: "category"
        widget: "select"
        options:
          - "contact football"
          - "flag football"
          - "anuncios"
      - label: "Subcategoría"
        name: "subcategory"
        widget: "select"
        options:
          - "contact varsity"
          - "contact juvenil"
          - "contact mini"
          - "contact micro"
          - "flag varsity"
          - "flag micro"
          - "flag mini"
          - "flag juvenil"
      - { label: "Cuerpo", name: "body", widget: "markdown" }
