backend:
  name: github
  repo: kiwanisfootball/kiwanisfootball2027
  branch: main
  base_url: https://kfl-decap-oauth.vercel.app # URL del puente que crearemos en el Paso 2
  auth_endpoint: /api/auth

media_folder: "assets/uploads/blog"
public_folder: "/assets/uploads/blog"

collections:
  - name: "blog"
    label: "Noticias KFL"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime" }
      - { label: "Imagen de Portada", name: "coverImage", widget: "image" }
      - { label: "Autor", name: "author", widget: "hidden", default: "kiwanisfootball" }
      - { label: "Resumen", name: "excerpt", widget: "text", required: false }
      - { label: "Cuerpo del Artículo", name: "body", widget: "markdown" }
