backend:
  name: github
  repo: kiwanisfootball/kiwanisfootball2027
  branch: main
  base_url: https://kfl-decap-oauth.vercel.app
  auth_endpoint: api/auth
  site_domain: kiwanisfootball2027.vercel.app

locale: 'es'
display_url: "https://kiwanisfootball2027.vercel.app"
logo_url: "/assets/img/KFL-logo.svg"

media_folder: "assets/uploads/blog"
public_folder: "/assets/uploads/blog"

collections:
  - name: "blog"
    label: "Noticias KFL"
    folder: "blog"
    create: true
    summary: "{{title}} | {{date}} | {{category}}"
    slug: "{{slug}}-{{day}}-{{month}}-{{year}}"
    path: "{{slug}}-{{day}}-{{month}}-{{year}}/index"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "DD/MM/YYYY", time_format: "hh:mm A" }
      - { label: "Imagen de Portada", name: "coverImage", widget: "image" }
      - { label: "Autor", name: "author", widget: "hidden", default: "kiwanisfootball" }
      - { label: "Resumen", name: "excerpt", widget: "text", required: false }
      - label: "Categoría Principal"
        name: "category"
        widget: "select"
        options:
          - "contact football"
          - "flag football"
          - "anuncios"
      - label: "Subcategoría"
        name: "subcategory"
        widget: "select"
        options:
          - "contact varsity"
          - "contact juvenil"
          - "contact mini"
          - "contact micro"
          - "flag varsity"
          - "flag micro"
          - "flag mini"
          - "flag juvenil"
      - { label: "Cuerpo", name: "body", widget: "markdown" }

  - name: "scores"
    label: "Marcadores en vivo"
    description: "Datos del ticker de la página principal, sincronizados desde el SOT."
    files:
      - file: "data/scores.json"
        label: "Ticker de resultados"
        name: "scores"
        fields:
          - { label: "Jornada activa", name: "currentWeek", widget: "string", hint: "Identificador de la jornada activa publicado por Google Sheets." }
          - label: "Partidos"
            name: "matches"
            widget: "list"
            summary: "{{fields.dia}} {{fields.hora}} | {{fields.h}} vs {{fields.v}} ({{fields.sL}} - {{fields.sV}}) | {{fields.cat}}"
            hint: "Solo resultados oficiales; no agregues datos de inscripción ni credenciales."
            fields:
              - { label: "Equipo local", name: "h", widget: "string" }
              - { label: "Equipo visitante", name: "v", widget: "string" }
              - { label: "Marcador local", name: "sL", widget: "number", value_type: "int" }
              - { label: "Marcador visitante", name: "sV", widget: "number", value_type: "int" }
              - { label: "Categoría", name: "cat", widget: "string" }
              - { label: "Modalidad", name: "modalidad", widget: "string" }
              - { label: "Jornada", name: "sem", widget: "string" }
              - { label: "Activo", name: "active", widget: "boolean", default: false }
              - { label: "Finalizado", name: "final", widget: "boolean", default: false }
              - { label: "Día", name: "dia", widget: "string", required: false }
              - { label: "Hora", name: "hora", widget: "string", required: false }

  - name: "contact-db"
    label: "Liga Contact"
    description: "Calendarios, posiciones base y rosters públicos de Contact sincronizados desde el SOT."
    files:
      - file: "data/contact-db.json"
        label: "Datos Contact"
        name: "contact"
        fields:
          - label: "Varsity"
            name: "varsity"
            widget: "object"
            fields:
              - { label: "Partidos", name: "partidos", widget: "list", required: false, summary: "{{fields.week}} | {{fields.date}} {{fields.time}} | {{fields.home}} vs {{fields.away}} ({{fields.scoreH}} - {{fields.scoreA}}) | {{fields.field}}", fields: [{ label: "Jornada", name: "week", widget: "string" }, { label: "Fecha", name: "date", widget: "string" }, { label: "Hora", name: "time", widget: "string" }, { label: "Cancha", name: "field", widget: "string" }, { label: "Local", name: "home", widget: "string" }, { label: "Visitante", name: "away", widget: "string" }, { label: "Marcador local", name: "scoreH", widget: "number", value_type: "int", required: false }, { label: "Marcador visitante", name: "scoreA", widget: "number", value_type: "int", required: false }, { label: "Tiene marcador", name: "hasScore", widget: "boolean", required: false }, { label: "Jamboree", name: "isJamboree", widget: "boolean", required: false }] }
              - { label: "Tabla de posiciones", name: "tabla", widget: "list", required: false, summary: "{{fields.equipo}} | JJ {{fields.jj}} | {{fields.pts}} pts | Dif {{fields.dif}}", fields: [{ label: "Equipo", name: "equipo", widget: "string" }, { label: "JJ", name: "jj", widget: "number", value_type: "int" }, { label: "JG", name: "jg", widget: "number", value_type: "int" }, { label: "JP", name: "jp", widget: "number", value_type: "int" }, { label: "JE", name: "je", widget: "number", value_type: "int" }, { label: "Puntos", name: "pts", widget: "number", value_type: "int" }, { label: "Favor", name: "pf", widget: "number", value_type: "int" }, { label: "Contra", name: "pc", widget: "number", value_type: "int" }, { label: "Diferencia", name: "dif", widget: "number", value_type: "int" }, { label: "Posición de origen", name: "rank", widget: "number", value_type: "int", required: false }, { label: "Desempate cara a cara", name: "h2h", widget: "object", required: false, fields: [{ label: "OWLS", name: "OWLS", widget: "number", value_type: "int", required: false }, { label: "RAIDERS", name: "RAIDERS", widget: "number", value_type: "int", required: false }, { label: "EAGLES", name: "EAGLES", widget: "number", value_type: "int", required: false }, { label: "SPARTANS", name: "SPARTANS", widget: "number", value_type: "int", required: false }, { label: "LIONS", name: "LIONS", widget: "number", value_type: "int", required: false }, { label: "DRAGONS", name: "DRAGONS", widget: "number", value_type: "int", required: false }, { label: "KOLTS", name: "KOLTS", widget: "number", value_type: "int", required: false }] }] }
              - label: "Rosters públicos"
                name: "rosters"
                widget: "list"
