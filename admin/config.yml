  - name: "campeones"
    label: "Palmarés histórico"
    description: "Campeones y subcampeones por modalidad y categoría."
    files:
      - file: "data/campeones.json"
        label: "Campeones KFL"
        name: "champions"
        fields:
          - label: "Temporadas"
            name: "records"
            widget: "list"
            summary: "{{fields.season}} | {{fields.modalidad}} {{fields.categoria}} | {{fields.campeon}} / {{fields.subcampeon}}"
            hint: "Mantén una fila por temporada; solo agrega campeones y subcampeones publicados oficialmente."
            fields:
              - { label: "Modalidad", name: "modalidad", widget: "select", options: ["contact", "flag"] }
              - { label: "Categoría", name: "categoria", widget: "select", options: ["varsity", "juvenil", "mini", "micro"] }
              - { label: "Temporada", name: "season", widget: "string" }
              - { label: "Campeón", name: "campeon", widget: "string" }
              - { label: "Subcampeón", name: "subcampeon", widget: "string", required: false }

  - name: "records"
    label: "Récords Varsity"
    description: "Récords deportivos publicados; no agregues datos personales de inscripción."
    files:
      - file: "data/records.json"
        label: "Récords Varsity"
        name: "records"
        fields:
          - label: "Récords"
            name: "records"
            widget: "list"
            summary: "{{fields.category}} | {{fields.statistic}}: {{fields.mark}} | {{fields.holder}} / {{fields.team}} | {{fields.season}}"
            hint: "Cada fila contiene únicamente categoría, estadística, marca, titular/equipo y temporada si están publicados."
            fields:
              - { label: "Categoría", name: "category", widget: "string", required: false }
              - { label: "Estadística", name: "statistic", widget: "string" }
              - { label: "Marca/valor", name: "mark", widget: "string" }
              - { label: "Titular público", name: "holder", widget: "string", required: false }
              - { label: "Equipo", name: "team", widget: "string", required: false }
              - { label: "Temporada", name: "season", widget: "string", required: false }

  - name: "mvp"
    label: "Líderes y MVP"
    description: "Registros deportivos de MVP por modalidad y categoría."
    files:
      - file: "data/mvp.json"
        label: "MVP KFL"
        name: "mvp"
        fields:
          - label: "MVP por temporada"
            name: "records"
            widget: "list"
            summary: "{{fields.season}} | {{fields.modalidad}} {{fields.categoria}} | {{fields.jugador}} ({{fields.equipo}})"
            hint: "Usa solo los datos publicados en la hoja histórica de MVP; no copies datos de inscripción."
            fields:
              - { label: "Modalidad", name: "modalidad", widget: "select", options: ["contact", "flag"] }
              - { label: "Categoría", name: "categoria", widget: "select", options: ["varsity", "juvenil", "mini", "micro"] }
              - { label: "Temporada", name: "season", widget: "string" }
              - { label: "Equipo", name: "equipo", widget: "string", required: false }
              - { label: "Jugador MVP", name: "jugador", widget: "string" }
