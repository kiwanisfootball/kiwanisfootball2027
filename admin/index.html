<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <title>KFL Admin | Centro de Control Deportivo y Editorial</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/KFL-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --kfl-navy: #0a2240;
      --kfl-red: #d32f2f;
      --kfl-blue: #0073aa;
      --kfl-bg: #f0f0f1;
      --kfl-surface: #ffffff;
      --kfl-border: #dcdcde;
      --kfl-sidebar: #1d2327;
    }

    body {
      font-family: 'Montserrat', sans-serif !important;
      background-color: var(--kfl-bg) !important;
      margin: 0;
      font-size: clamp(0.8125rem, 0.78rem + 0.12vw, 0.875rem);
    }

    #nc-root {
      min-height: 100vh;
      background: var(--kfl-bg);
      color: #1d2327;
      font-family: 'Montserrat', sans-serif !important;
      font-size: clamp(0.8125rem, 0.78rem + 0.12vw, 0.875rem);
    }

    #nc-root button,
    #nc-root input,
    #nc-root select,
    #nc-root textarea {
      font-family: 'Montserrat', sans-serif !important;
      font-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.875rem);
    }

    [class*="AppHeader"] {
      position: relative !important;
      z-index: 1 !important;
      display: flex;
      align-items: center;
      background: var(--kfl-navy) !important;
      border-bottom: 3px solid var(--kfl-red);
      box-shadow: none !important;
    }

    [class*="AppHeader"] button,
    [class*="PublishButton"],
    [class*="SaveButton"],
    button[class*="Primary"] {
      min-height: 36px;
      padding: 7px 14px !important;
      border: 1px solid transparent !important;
      border-radius: 4px !important;
      color: #ffffff !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.875rem) !important;
      font-weight: 700 !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      visibility: visible !important;
    }

    [class*="PublishButton"],
    [class*="AppHeader"] button[class*="Primary"] {
      background: var(--kfl-red) !important;
      border-color: var(--kfl-red) !important;
    }

    [class*="SaveButton"],
    [class*="AppHeader"] button:not([class*="Publish"]) {
      background: var(--kfl-blue) !important;
      border-color: var(--kfl-blue) !important;
    }

    [class*="AppHeader"] button:hover,
    [class*="PublishButton"]:hover,
    [class*="SaveButton"]:hover {
      filter: brightness(1.08);
    }

    [class*="SidebarContainer"] {
      position: relative;
      background: var(--kfl-sidebar) !important;
      border-right: 1px solid #32373c;
      color: #ffffff !important;
    }

    [class*="SidebarContainer"]::before {
      content: "";
      display: block;
      height: 54px;
      margin: 16px 16px 8px;
      background: url("/assets/img/KFL-logo.svg") center / contain no-repeat;
    }

    [class*="SidebarContainer"] h2 {
      margin: 8px 16px 12px;
      font-family: 'Anton', sans-serif !important;
      font-size: clamp(1rem, 0.95rem + 0.2vw, 1.125rem) !important;
      letter-spacing: 0.04em;
      color: #ffffff !important;
    }

    [class*="SidebarContainer"] a,
    [class*="SidebarContainer"] button {
      color: #ffffff !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.875rem) !important;
    }

    [class*="SidebarContainer"] a:hover,
    [class*="SidebarContainer"] [aria-current="page"],
    [class*="SidebarContainer"] [class*="active"] {
      background: var(--kfl-blue) !important;
      color: #ffffff !important;
    }

    [class*="AppMainContainer"],
    [class*="MainContainer"],
    [class*="CollectionPage"] {
      background: var(--kfl-bg) !important;
    }

    [class*="ControlPaneContainer"] {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      align-items: start;
      gap: clamp(8px, 1.2vw, 16px) !important;
      padding: clamp(12px, 2vw, 24px) !important;
      background: var(--kfl-surface) !important;
      border: 1px solid var(--kfl-border) !important;
      border-radius: 6px;
    }

    [class*="ObjectControl"] [class*="ControlPaneContainer"],
    [class*="ListControl"] [class*="ControlPaneContainer"] {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    [class*="ControlPaneContainer"] label,
    [class*="ControlPaneContainer"] [class*="Label"] {
      font-family: 'Montserrat', sans-serif !important;
      font-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.875rem) !important;
      font-weight: 600;
    }

    [class*="EntryCard"],
    [class*="ListCard"],
    [class*="ObjectControl"] [class*="ListItem"],
    [class*="ListControl"] [class*="ListItem"] {
      min-width: 0;
      background: var(--kfl-surface) !important;
      border: 1px solid var(--kfl-border) !important;
      border-radius: 5px;
      box-shadow: none !important;
    }

    [class*="EntryCard"] *,
    [class*="ListCard"] * {
      font-family: 'Montserrat', sans-serif !important;
    }

    @media (max-width: 600px) {
      [class*="ControlPaneContainer"],
      [class*="ObjectControl"] [class*="ControlPaneContainer"],
      [class*="ListControl"] [class*="ControlPaneContainer"] {
        grid-template-columns: minmax(0, 1fr);
        padding: 12px !important;
      }

      [class*="AppHeader"] {
        flex-wrap: wrap;
      }

      [class*="AppHeader"] button,
      [class*="PublishButton"],
      [class*="SaveButton"] {
        min-height: 34px;
        padding: 6px 10px !important;
      }
    }
  </style>
</head>
<body>
  <!-- Carga de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      // Inyectar estilos reales del sitio en el panel de vista previa
      CMS.registerPreviewStyle('/css/global.css');
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap');
    }
  </script>
</body>
</html>
