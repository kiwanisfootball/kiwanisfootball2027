<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>KFL Admin | Centro de Control Deportivo y Editorial</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/KFL-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --kfl-navy: #0a2240;
      --kfl-red: #d32f2f;
      --kfl-gold: #f5b400;
      --kfl-bg: #f4f6f9;
      --kfl-surface: #ffffff;
      --kfl-text: #1a202c;
    }

    body {
      font-family: 'Montserrat', sans-serif !important;
      background-color: var(--kfl-bg) !important;
      margin: 0;
    }

    /* Barra superior personalizada KFL */
    .kfl-admin-topbar {
      background: linear-gradient(90deg, var(--kfl-navy) 0%, #133563 100%);
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--kfl-red);
      font-size: clamp(0.75rem, 1.5vw, 0.875rem);
      position: relative;
      z-index: 9999;
    }

    .kfl-admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.5px;
      font-size: clamp(1rem, 2vw, 1.25rem);
    }

    .kfl-admin-brand img {
      height: 32px;
      width: auto;
    }

    .kfl-admin-badge {
      background: rgba(255, 255, 255, 0.14);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: clamp(0.7rem, 1.2vw, 0.8rem);
    }

    /* Personalización de botones y encabezados internos de Decap CMS */
    [class*="AppHeader"] {
      background-color: var(--kfl-navy) !important;
    }

    [class*="PublishButton"],
    button[class*="Primary"] {
      background-color: var(--kfl-red) !important;
      border-color: var(--kfl-red) !important;
      font-family: 'Montserrat', sans-serif !important;
      font-weight: 700 !important;
    }

    [class*="SidebarContainer"] h2 {
      font-family: 'Anton', sans-serif !important;
      letter-spacing: 0.5px;
      color: var(--kfl-navy) !important;
    }
  </style>
</head>
<body>
  <div class="kfl-admin-topbar">
    <div class="kfl-admin-brand">
      <img src="/assets/img/KFL-logo.svg" alt="KFL Logo" />
      <span>CONSOLA DE ADMINISTRACIÓN — KIWANIS FOOTBALL LEAGUE</span>
    </div>
    <div class="kfl-admin-badge">SOT: Google Sheets Sincronizado</div>
  </div>

  <!-- Carga de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      // Inyectar estilos reales del sitio en el panel de vista previa
      CMS.registerPreviewStyle('/css/global.css');
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap');
    }
  </script>
</body>
</html>
