<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">Artículo - Kiwanis Football League</title>
  
  <meta name="description" id="meta-desc" content="Cobertura oficial, resultados y noticias de la Kiwanis Football League en Panamá.">
  <meta name="author" content="Kiwanis Football League">
  <meta name="robots" content="index, follow">
  
  <meta property="og:type" content="article">
  <meta property="og:title" id="og-title" content="Artículo - Kiwanis Football League">
  <meta property="og:description" id="og-desc" content="Cobertura oficial, resultados y noticias de la Kiwanis Football League en Panamá.">
  <meta property="og:image" id="og-image" content="/assets/img/KFL-logo.png">
  <meta property="og:url" content="">
  <meta property="og:locale" content="es_PA">

  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="container article-main">
    <article id="article-content">
      <h1 id="art-title">Cargando artículo...</h1>
      <p id="art-meta" class="text-muted"></p>
      <img id="art-cover" src="" alt="" style="max-width:100%; display:none;">
      <div id="art-body"></div>
    </article>
  </main>

  <div id="footer-container"></div>

  <script src="/js/components.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const pathSegments = window.location.pathname.split('/');
      const slug = pathSegments[pathSegments.indexOf('articulo') + 1];

      if (!slug) {
        document.getElementById('art-title').innerText = "Artículo no encontrado";
        return;
      }

      try {
        const response = await fetch(`/blog/${slug}/index.md`);
        if (!response.ok) throw new Error("No se pudo cargar el artículo");
        const markdownText = await response.text();

        const matchFrontmatter = markdownText.match(/^---[\s\S]*?---/);
        let title = slug.replace(/-\d{2}-\d{2}-\d{4}$/, '').replace(/-/g, ' ');
        let cover = "/assets/img/KFL-logo.png";
        let body = markdownText;

        if (matchFrontmatter) {
          const fm = matchFrontmatter[0];
          body = markdownText.replace(fm, '').trim();
          const tMatch = fm.match(/title:\s*["']?([^"'\n]+)["']?/);
          if (tMatch) title = tMatch[1];
          const imgMatch = fm.match(/coverImage:\s*["']?([^"'\n]+)["']?/);
          if (imgMatch) {
            cover = imgMatch[1];
            if (cover.startsWith('assets/')) cover = '/' + cover;
          }
        }

        document.getElementById('meta-title').innerText = title + " - Kiwanis Football League";
        document.getElementById('og-title').innerText = title;
        document.getElementById('art-title').innerText = title;
        const imgEl = document.getElementById('art-cover');
        if (cover) {
          imgEl.src = cover;
          imgEl.style.display = 'block';
        }
        document.getElementById('art-body').innerHTML = body;
      } catch (error) {
        console.error("Error al cargar el artículo:", error);
        document.getElementById('art-title').innerText = "Error al cargar el artículo";
      }
    });
  </script>
</body>
</html>
