<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0">
  <title id="meta-title">Artículo - Kiwanis Football League</title>

  <meta name="description" id="meta-desc" content="Cobertura oficial, resultados y noticias de la Kiwanis Football League en Panamá.">
  <meta name="author" content="Kiwanis Football League">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="article">
  <meta property="og:title" id="og-title" content="Artículo - Kiwanis Football League">
  <meta property="og:description" id="og-desc" content="Cobertura oficial, resultados y noticias de la Kiwanis Football League en Panamá.">
  <meta property="og:image" id="og-image" content="/assets/img/KFL-logo.png">
  <meta property="og:url" id="og-url" content="">
  <meta property="og:locale" content="es_PA">

  <!-- Google Fonts: Anton & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/articulo.css">
</head>
<body class="contact-theme">
  <!-- HEADER GLOBAL (Inyectado por components.js) -->
  <header class="header-nav" id="globalNav"></header>

  <main class="article-container">
    <article id="article-content">
      <div class="article-header">
        <h1 id="art-title" class="article-title">Cargando artículo...</h1>
        <p id="art-meta" class="article-meta"></p>
      </div>

      <div id="art-cover-wrapper" class="article-cover-container" style="display:none;">
        <img id="art-cover" class="article-cover-img" src="" alt="">
      </div>

      <div id="art-body" class="article-body"></div>
    </article>
  </main>

  <!-- FOOTER GLOBAL (Inyectado por components.js) -->
  <div id="globalFooter"></div>

  <script src="/js/components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        document.getElementById('art-title').innerText = "Artículo no encontrado";
        return;
      }

      try {
        const response = await fetch(`/blog/${encodeURIComponent(slug)}/index.md`, { cache: 'no-store' });
        if (!response.ok) throw new Error("No se pudo cargar el artículo");
        const markdownText = await response.text();

        const matchFrontmatter = markdownText.match(/^---[\s\S]*?---/);
        let title = slug.replace(/-\d{2}-\d{2}-\d{4}$/, '').replace(/-/g, ' ');
        let fecha = "";
        let categoria = "";
        let excerpt = "";
        let cover = "";
        let body = markdownText;

        if (matchFrontmatter) {
          const fm = matchFrontmatter[0];
          body = markdownText.replace(fm, '').trim();

          const get = (key) => {
            const m = fm.match(new RegExp(`${key}:\\s*["']?([^"'\\n]+)["']?`));
            return m ? m[1].trim() : "";
          };

          title = get('title') || title;
          fecha = get('date');
          categoria = get('category');
          excerpt = get('excerpt');
          cover = get('coverImage');
          if (cover.startsWith('assets/')) cover = '/' + cover;
        }

        const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const tituloSeguro = esc(title);
        const descripcion = excerpt || "Cobertura oficial de la Kiwanis Football League en Panamá.";
        const urlActual = window.location.href;

        document.title = `${title} - Kiwanis Football League`;
        document.getElementById('meta-title').innerText = `${title} - Kiwanis Football League`;
        document.getElementById('meta-desc').setAttribute('content', descripcion);
        document.getElementById('og-title').setAttribute('content', title);
        document.getElementById('og-desc').setAttribute('content', descripcion);
        document.getElementById('og-url').setAttribute('content', urlActual);
        if (cover) document.getElementById('og-image').setAttribute('content', cover);

        document.getElementById('art-title').innerText = title;
        document.getElementById('art-meta').innerText = [fecha, categoria].filter(Boolean).join(" • ");

        const coverWrapper = document.getElementById('art-cover-wrapper');
        const imgEl = document.getElementById('art-cover');
        if (cover) {
          imgEl.onerror = () => { coverWrapper.style.display = 'none'; };
          imgEl.src = cover;
          imgEl.alt = tituloSeguro;
          coverWrapper.style.display = 'block';
        }

        document.getElementById('art-body').innerHTML = marked.parse(body);
      } catch (error) {
        console.error("Error al cargar el artículo:", error);
        document.getElementById('art-title').innerText = "Error al cargar el artículo";
      }
    });
  </script>
</body>
</html>
