<!-- SCRIPT DE CARGA AUTOMÁTICA DESDE LOS MARKDOWN -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Lista de slugs de tus artículos publicados (el primero será el más reciente en grande)
    const slugsArticulosIndex = [
      "2026-10-26-aip-y-eagles-sellan-su-pase-a-la-gran-final-de-la-kfl-mini-contact-2026"
      // Aquí puedes agregar más slugs de tus archivos .md conforme los vayas creando en Decap
    ];

    cargarSeccionNoticiasIndex(slugsArticulosIndex);
  });

  async function cargarSeccionNoticiasIndex(slugs) {
    const mainFeaturedContainer = document.getElementById('mainFeaturedPost');
    const sidebarContainer = document.getElementById('sidebarNewsList');

    if (!slugs || slugs.length === 0) {
      mainFeaturedContainer.innerHTML = "<p style='padding:20px; text-align:center;'>No hay noticias destacadas.</p>";
      sidebarContainer.innerHTML = "<p style='padding:10px; text-align:center;'>Sin noticias recientes.</p>";
      return;
    }

    let postsCargados = [];

    // Leer los archivos .md correspondientes
    for (let slug of slugs) {
      try {
        let respuesta = await fetch(`blog/${slug}.md`);
        if (!respuesta.ok) continue;
        let textoMd = await respuesta.text();

        let matchFrontmatter = textoMd.match(/^---[\s\S]*?---/);
        let titulo = slug.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' ').toUpperCase();
        let categoria = "KFL";
        let excerpt = "Haz clic para leer el comunicado oficial...";
        let coverImage = "https://i.imgur.com/wrPDjDN.png"; // Imagen por defecto KFL si no tiene

        if (matchFrontmatter) {
          let frontmatter = matchFrontmatter[0];
          
          let tMatch = frontmatter.match(/title:\s*["']?([^"'\n]+)["']?/);
          if (tMatch) titulo = tMatch[1];

          let catMatch = frontmatter.match(/category:\s*["']?([^"'\n]+)["']?/);
          if (catMatch) categoria = catMatch[1];

          let eMatch = frontmatter.match(/excerpt:\s*["']?([^"'\n]+)["']?/);
          if (eMatch) excerpt = eMatch[1];

          let imgMatch = frontmatter.match(/coverImage:\s*["']?([^"'\n]+)["']?/);
          if (imgMatch) {
            coverImage = imgMatch[1];
            if (coverImage.startsWith('assets/')) coverImage = '/' + coverImage;
          }
        }

        postsCargados.push({ slug, titulo, categoria, excerpt, coverImage });
      } catch (e) {
        console.error("Error cargando post para el index:", slug);
      }
    }

    if (postsCargados.length === 0) return;

    // 1. RENDERIZAR LA NOTICIA PRINCIPAL (LA MÁS RECIENTE A LA IZQUIERDA)
    let postPrincipal = postsCargados[0];
    mainFeaturedContainer.onclick = () => window.location.href = `articulo.html?slug=${postPrincipal.slug}`;
    mainFeaturedContainer.innerHTML = `
      <div class="featured-img-container">
        <img src="${postPrincipal.coverImage}" alt="${postPrincipal.titulo}" class="featured-img">
      </div>
      <div class="featured-body">
        <span class="badge-category">${postPrincipal.categoria}</span>
        <h3>${postPrincipal.titulo}</h3>
        <p>${postPrincipal.excerpt}</p>
      </div>
    `;

    // 2. RENDERIZAR LAS ÚLTIMAS NOTICIAS EN LA DERECHA (MÁXIMO 4)
    // Usamos el resto de posts o duplicamos/mostramos la lista disponible
    let listaSidebarHtml = "";
    let postsSecundarios = postsCargados.slice(0, 4); // Toma máximo 4

    postsSecundarios.forEach(post => {
      listaSidebarHtml += `
        <div class="sidebar-news-item" onclick="window.location.href='articulo.html?slug=${post.slug}'">
          <img src="${post.coverImage}" alt="${post.titulo}" class="sidebar-thumb">
          <div class="sidebar-info">
            <span class="sidebar-tag">${post.categoria}</span>
            <h4>${post.titulo}</h4>
          </div>
        </div>
      `;
    });

    sidebarContainer.innerHTML = listaSidebarHtml || "<p style='font-size:13px; color:#64748b;'>No hay más noticias recientes.</p>";
  }
</script>
