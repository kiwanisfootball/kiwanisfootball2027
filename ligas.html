<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligas - Kiwanis Football League Panama</title>
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="https://i.imgur.com/wrPDjDN.png">
</head>
<body class="contact-theme">

  <!-- 1. HEADER NAVEGACIÓN -->
  <header class="header-nav">
    <nav class="navbar">
      <a href="index.html" class="nav-logo">
        <img src="https://i.imgur.com/wrPDjDN.png" alt="Kiwanis Football League Panama">
      </a>

      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir Menú">&#9776;</button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">HOME</a></li>
        <li><a href="conocenos.html">CONÓCENOS</a></li>
        <li><a href="ligas.html" class="active">LIGAS</a></li>
        <li><a href="fotos.html">FOTOS</a></li>
        <li><a href="mvp.html">MVP</a></li>
        <li><a href="campeones.html">CAMPEONES</a></li>
        <li><a href="inscripcion.html">INSCRIPCIÓN</a></li>
        <li><a href="total-access.html">TOTAL ACCESS</a></li>
        <li><a href="contacto.html">CONTACTO</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- 2. TARJETAS HERO CON OVERLAY TRANSPARENTE & EFECTO GREYED OUT -->
    <section class="leagues-hero-grid">
      <div class="league-hero-card contact-card active" id="cardContact" onclick="selectLeague('contact')">
        <img src="assets/img/ligas-contact-football.jpg" alt="Contact Football Masculino" class="hero-bg-img">
        <div class="hero-overlay">
          <h2>CONTACT FOOTBALL</h2>
          <span>MASCULINO</span>
        </div>
      </div>

      <div class="league-hero-card flag-card inactive" id="cardFlag" onclick="selectLeague('flag')">
        <img src="assets/img/ligas-flag-football.jpg" alt="Flag Football Femenino" class="hero-bg-img">
        <div class="hero-overlay">
          <h2>FLAG FOOTBALL</h2>
          <span>FEMENINO</span>
        </div>
      </div>
    </section>

    <!-- 3. PÍLDORAS DE CATEGORÍA DE ANCHO Y ESTILO HOMOGÉNEO -->
    <section class="category-pills-wrapper">
      <button class="category-pill-btn active" onclick="selectCategory('varsity')">VARSITY</button>
      <button class="category-pill-btn" onclick="selectCategory('juvenil')">JUVENIL</button>
      <button class="category-pill-btn" onclick="selectCategory('mini')">MINI</button>
      <button class="category-pill-btn" onclick="selectCategory('micro')">MICRO</button>
    </section>

    <!-- 4. CONTENEDOR PRINCIPAL CON SUB-PESTAÑAS -->
    <section class="league-display-wrapper">
      
      <!-- 4 SUB-PESTAÑAS OFICIALES -->
      <div class="sub-tabs-bar">
        <button class="sub-tab-btn active" onclick="selectSubTab('calendario')">Calendario</button>
        <button class="sub-tab-btn" onclick="selectSubTab('rosters')">Rosters</button>
        <button class="sub-tab-btn" onclick="selectSubTab('posiciones')">Tabla de Posiciones</button>
        <button class="sub-tab-btn" onclick="selectSubTab('stats')">Estadísticas</button>
      </div>

      <!-- VISTA 1: CALENDARIO -->
      <div class="tab-pane active" id="pane-calendario">
        <iframe id="iframeCalendario" class="external-frame" src=""></iframe>
      </div>

      <!-- VISTA 2: ROSTERS (EQUIPOS CARGADOS DINÁMICAMENTE) -->
      <div class="tab-pane" id="pane-rosters">
        <div class="rosters-grid" id="rostersGrid">
          <!-- Se puebla automáticamente vía JS -->
        </div>
      </div>

      <!-- VISTA 3: TABLA DE POSICIONES -->
      <div class="tab-pane" id="pane-posiciones">
        <iframe id="iframePosiciones" class="external-frame" src=""></iframe>
      </div>

      <!-- VISTA 4: ESTADÍSTICAS -->
      <div class="tab-pane" id="pane-stats">
        <iframe id="iframeStats" class="external-frame" src=""></iframe>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kiwanis Football League Panama. Todos los derechos reservados.</p>
  </footer>

  <!-- SCRIPT LÓGICO Y RENDERIZADO DE DATOS -->
  <script>
    // Configuración base de Apps Script (Tus deployments)
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbwj6Dtr9D_nHfO0gg1EpSepSR6JKY_t0OfmXAAAvhuypF18RsG0UjVwbcKpM_ITjuEP7w/exec";

    // Base de datos de logos de equipos (Centralizada para no editar código al agregar o quitar)
    const EQUIPOS_LOGOS = {
      "OWLS": "https://i.imgur.com/KRjk1AV.png",
      "RAIDERS": "https://i.imgur.com/HP1WeCM.png",
      "EAGLES": "https://i.imgur.com/lxfq565.png",
      "KOLTS": "https://i.imgur.com/id2gPdH.png",
      "DRAGONS": "https://i.imgur.com/SP6wgNT.png",
      "SPARTANS": "https://i.imgur.com/JGvY0Zk.png",
      "LIONS": "https://i.imgur.com/XQaNhUb.png"
    };

    // Equipos por Categoría (Se actualiza automáticamente desde Apps Script en producción)
    const CATEGORIAS_EQUIPOS = {
      "contact": {
        "varsity": ["OWLS", "RAIDERS", "EAGLES", "KOLTS", "DRAGONS", "SPARTANS"],
        "juvenil": ["OWLS", "RAIDERS", "EAGLES", "KOLTS", "DRAGONS"],
        "mini": ["OWLS", "RAIDERS", "EAGLES", "KOLTS"],
        "micro": ["OWLS", "RAIDERS", "EAGLES"]
      },
      "flag": {
        "varsity": ["OWLS", "RAIDERS", "EAGLES", "KOLTS", "DRAGONS", "LIONS"],
        "juvenil": ["OWLS", "RAIDERS", "EAGLES", "KOLTS"],
        "mini": ["OWLS", "RAIDERS", "EAGLES"],
        "micro": ["OWLS", "RAIDERS"]
      }
    };

    // Estado activo
    let activeLeague = 'contact';
    let activeCategory = 'varsity';
    let activeSubTab = 'calendario';

    // Menú Hamburguesa
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');
    if (hamburgerBtn) {
      hamburgerBtn.addEventListener('click', () => navMenu.classList.toggle('open'));
    }

    // 1. Cambiar Liga
    function selectLeague(league) {
      activeLeague = league;

      const cardContact = document.getElementById('cardContact');
      const cardFlag = document.getElementById('cardFlag');

      if (league === 'contact') {
        cardContact.classList.add('active');
        cardContact.classList.remove('inactive');
        cardFlag.classList.add('inactive');
        cardFlag.classList.remove('active');
        document.body.className = 'contact-theme';
      } else {
        cardFlag.classList.add('active');
        cardFlag.classList.remove('inactive');
        cardContact.classList.add('inactive');
        cardContact.classList.remove('active');
        document.body.className = 'flag-theme';
      }

      updateAllPanes();
    }

    // 2. Cambiar Categoría
    function selectCategory(category) {
      activeCategory = category;

      document.querySelectorAll('.category-pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === category);
      });

      updateAllPanes();
    }

    // 3. Cambiar Sub-pestaña
    function selectSubTab(subTab) {
      activeSubTab = subTab;

      document.querySelectorAll('.sub-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(subTab));
      });

      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
      document.getElementById('pane-' + subTab).classList.add('active');

      updateAllPanes();
    }

    // 4. Actualizar iFrames y Rosters
    function updateAllPanes() {
      // Cargar Rosters
      if (activeSubTab === 'rosters') {
        renderRostersGrid();
      }

      // Cargar URLs para iFrames
      const catUpper = activeCategory.toUpperCase();
      const iframeCal = document.getElementById('iframeCalendario');
      const iframePos = document.getElementById('iframePosiciones');
      const iframeStat = document.getElementById('iframeStats');

      if (iframeCal && activeSubTab === 'calendario') {
        iframeCal.src = `${APPS_SCRIPT_BASE_URL}?modulo=calendario&categoria=${catUpper}&liga=${activeLeague}`;
      }
      if (iframePos && activeSubTab === 'posiciones') {
        iframePos.src = `${APPS_SCRIPT_BASE_URL}?modulo=posiciones&categoria=${catUpper}&liga=${activeLeague}`;
      }
      if (iframeStat && activeSubTab === 'stats') {
        iframeStat.src = `${APPS_SCRIPT_BASE_URL}?modulo=stats&categoria=${catUpper}&liga=${activeLeague}`;
      }
    }

    // 5. Renderizar Rosters Dinámicos
    function renderRostersGrid() {
      const grid = document.getElementById('rostersGrid');
      if (!grid) return;

      const equipos = CATEGORIAS_EQUIPOS[activeLeague][activeCategory] || [];
      grid.innerHTML = '';

      equipos.forEach(equipo => {
        const logoUrl = EQUIPOS_LOGOS[equipo] || 'https://i.imgur.com/wrPDjDN.png';
        const card = document.createElement('div');
        card.className = 'team-card-roster';
        card.onclick = () => openRosterModal(equipo);

        card.innerHTML = `
          <img src="${logoUrl}" alt="${equipo}">
          <h4>${equipo}</h4>
        `;
        grid.appendChild(card);
      });
    }

    // Abrir Roster del Equipo
    function openRosterModal(equipo) {
      const catUpper = activeCategory.toUpperCase();
      const url = `${APPS_SCRIPT_BASE_URL}?categoria=${catUpper}&equipo=${equipo}`;
      window.open(url, '_blank', 'width=900,height=750');
    }

    // Carga inicial
    updateAllPanes();
  </script>
</body>
</html>
