<script>
    // URL CSV PUBLICADA DESDE GOOGLE SHEETS
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZBPaF9KU4Q-eTZynwu3zjbId5ZJbd8cUFAOXkZyxfZDQ2loGXIVXy1wpq8zyv9zcAzkaHiRYIanf5/pub?output=csv';

    const categoryMap = {
      'MICRO CONTACT': 'table-micro-contact',
      'MINI CONTACT': 'table-mini-contact',
      'MINI FLAG': 'table-mini-flag',
      'JUVENIL CONTACT': 'table-juvenil-contact',
      'JUVENIL FLAG': 'table-juvenil-flag',
      'VARSITY CONTACT': 'table-varsity-contact',
      'VARSITY FLAG': 'table-varsity-flag'
    };

    document.addEventListener('DOMContentLoaded', () => {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navMenu = document.getElementById('navMenu');
      if (hamburgerBtn) {
        hamburgerBtn.addEventListener('click', () => navMenu.classList.toggle('open'));
      }

      loadMvpData();
    });

    function filterCategory(category, btnElement) {
      document.querySelectorAll('.mvp-filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const sections = document.querySelectorAll('.mvp-category-section');
      sections.forEach(sec => {
        if (category === 'all' || sec.getAttribute('data-category') === category) {
          sec.style.display = 'block';
        } else {
          sec.style.display = 'none';
        }
      });
    }

    /* CARGADOR Y PROCESADOR DE CSV CON SOPORTE PARA CELDAS COMBINADAS (CO-MVP) */
    async function loadMvpData() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('No se pudo conectar con Google Sheets');
        
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) return;

        // Limpia los mensajes "Cargando registros..."
        Object.values(categoryMap).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = '';
        });

        // Detecta si la primera columna es "Categoria" o si es hoja directa
        const isSingleSheet = rows[0][0].toLowerCase().includes('categoria');
        
        let lastSeenCategory = '';
        let lastSeenSeason = '';

        const startRow = 1; // Omitir cabecera

        for (let i = startRow; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          let cat = '', season = '', equipo = '', jugador = '';

          if (isSingleSheet) {
            [cat, season, equipo, jugador] = row;
            if (cat && cat.trim() !== '') lastSeenCategory = cat.trim();
            else cat = lastSeenCategory;
          } else {
            [season, equipo, jugador] = row;
          }

          // SI EL AÑO VIENE VACÍO POR CELDA COMBINADA (CO-MVP), USAR EL ÚLTIMO AÑO LEÍDO
          if (season && season.trim() !== '') {
            lastSeenSeason = season.trim();
          } else {
            season = lastSeenSeason;
          }

          if (!jugador || jugador.trim() === '') continue;

          // Mapeo e inyección en HTML
          const catKey = isSingleSheet ? cat.toUpperCase() : 'TODOS';
          const targetId = categoryMap[catKey];

          if (targetId) {
            const tbody = document.getElementById(targetId);
            if (tbody) {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${season}</td>
                <td>${equipo || '-'}</td>
                <td class="mvp-player-name">${jugador}</td>
              `;
              tbody.appendChild(tr);
            }
          }
        }

        // Si alguna tabla quedó sin filas, colocar mensaje informativo
        Object.values(categoryMap).forEach(id => {
          const el = document.getElementById(id);
          if (el && el.children.length === 0) {
            el.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">Sin registros publicados aún.</td></tr>';
          }
        });

      } catch (err) {
        console.error('Error cargando la tabla de MVP:', err);
        Object.values(categoryMap).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ef4444;">Error al cargar los datos desde Google Sheets.</td></tr>';
        });
      }
    }

    /* PARSER MANUAL DE LÍNEAS CSV */
    function parseCSV(text) {
      if (!text) return [];
      const lines = text.split(/\r?\n/);
      return lines.map(line => {
        const result = [];
        let insideQuote = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            result.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        result.push(entry.trim().replace(/^"|"$/g, ''));
        return result;
      });
    }
  </script>
