  }

  }

    object-fit: contain;
  }

  /* MENÚ: Centrado con distribución proporcional y flexible */

  /* BOTONES DEL MENÚ: Ancho relativo, centrados y con área de clic cómoda */

    font-family: 'Avenir', sans-serif !important;
    font-size: 11.5px;
    font-weight: 800;
    color: #19547E;
    text-decoration: none;
    text-transform: uppercase;
    white-space: nowrap;
    letter-spacing: 0.2px;
    padding: 8px 10px;
    text-align: center;
    width: 100%;
    border-radius: 6px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .nav-menu li a:hover {
    background-color: #f1f5f9;
    color: #19547E; 
  }

  /* ESTILO DE LA PÁGINA ACTIVA (Fondo azul institucional y texto blanco como indicabas) */
  .nav-menu li a.active {
    background-color: #19547E !important;
    color: #ffffff !important;
  }

  .hamburger-btn {
    display: none;
    background: none;
    border: none;
    font-size: 24px;

  /* RESPONSIVE MÓVILES */
  @media (max-width: 1250px) {
    .nav-logo {

      display: block;
    }

    .nav-menu {
      display: none;

    .nav-menu li a {
      font-size: 14px;
      padding: 10px;
    }
  }
</style>

<script>
  // Script para detectar la página actual y aplicarle la clase activa
  document.addEventListener("DOMContentLoaded", function() {
    const currentPath = window.location.pathname.split("/").pop() || "index.html";
    const menuLinks = document.querySelectorAll('.nav-menu li a');
    
    menuLinks.forEach(link => {
      const linkPage = link.getAttribute('data-page');
      if (linkPage === currentPath) {
        link.classList.add('active');
      }
    });
  });
</script>
